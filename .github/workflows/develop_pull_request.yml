name: develop pull request Check and Test (CI)

on:
  pull_request:
    branches: [ "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [ 17 ]
        distribution: [ 'temurin' ]

    steps:
      # 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # Secrets ENV GITHUB_ENV 등록
      - name: Load ENV into Environment Variable
        run: echo "${{ secrets.ENV }}" >> $GITHUB_ENV

      # JDK 17 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: ${{ matrix.distribution }}

      - name: Run container # 테스트 시에 레디스 필요
        run: docker compose -f ./docker-compose-test.yml up -d

      # Gradlew 생행 권한 허용
      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      # Gradle setup
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          arguments: check
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Send to slack notification
        uses: slackapi/slack-github-action@v2.1.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            text: "PR event"
            blocks: 
              - type: section
                text:
                  type: mrkdwn
                  text: "${{ secrets.SLACK_GROUP_MENTION }}\n\n📌 *PR 이벤트 알림 (<${{ github.event.pull_request.html_url }}|#${{ github.event.pull_request.number }}>)*"
              - type: section
                text:
                  type: mrkdwn
                  text: "> PR 이벤트 알림입니다.\n> *최신 변경 사항 검토*, *코드 리뷰* 부탁드립니다."
              - type: section
                text:
                  type: mrkdwn
                  text: "*PR:* 🔗 <${{ github.event.pull_request.html_url }}|${{ github.event.pull_request.title }}>"
              - type: context
                elements:
                  - type: mrkdwn
                    text: "*브랜치:* `${{ github.head_ref }}` -> `${{ github.base_ref }}`"
                  - type: mrkdwn
                    text: "*작성자:* ${{ github.event.pull_request.user.login }}"
              - type: divider